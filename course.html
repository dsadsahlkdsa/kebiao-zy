<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课程详情 · 课表优化</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="hero">
  <p class="kicker">课程详情</p>
  <h1 id="courseTitle">加载中…</h1>
  <p class="sub" id="courseSub"></p>
  <a class="back" href="index.html">← 返回课表总览</a>
</header>

<main>
  <nav class="topnav">
    <a href="#sec-exp">师兄经验</a>
    <a href="#sec-info">基本信息</a>
    <a href="#sec-note">我的笔记</a>
    <a href="#sec-focus">考试重点</a>
    <a href="#sec-exams">考试安排</a>
    <a href="#sec-tl">时间轴</a>
    <a href="#sec-method">学习方法</a>
    <a href="#sec-files">课程资料</a>
  </nav>

  <section class="panel" id="sec-exp">
    <h2>备考经验 <span class="hint">师兄师姐的经验帖 · 点击直达</span></h2>
    <div id="courseExp"></div>
  </section>

  <section class="panel" id="sec-info">
    <h2>基本信息</h2>
    <div class="detail-grid" id="infoGrid"></div>
  </section>

  <section class="panel" id="sec-note">
    <h2>我的笔记 <span class="hint">仅保存在当前浏览器 · 自动保存</span></h2>
    <div class="note-wrap">
      <textarea id="courseNote" placeholder="写下这门课的笔记、复习心得、易错点……"></textarea>
      <div class="note-bar">
        <button type="button" id="noteSave">保存笔记</button>
        <button type="button" id="noteClear" class="ghost">清空</button>
        <button type="button" id="noteExport" class="ghost">导出备份</button>
        <button type="button" id="noteImport" class="ghost">导入备份</button>
        <input type="file" id="noteImportFile" accept="application/json,.json" hidden>
        <span id="noteStatus"></span>
      </div>
    </div>
  </section>

  <section class="panel" id="sec-focus">
    <h2>🎯 考试重点 <span class="hint">从备考资料中精炼 · 指导前期学习</span></h2>
    <div id="focusBody"></div>
  </section>

  <section class="panel" id="sec-exams">
    <h2>考试安排</h2>
    <div class="exam-list" id="courseExams"></div>
  </section>

  <section class="panel" id="sec-tl">
    <h2>教学时间轴</h2>
    <div class="timeline mini-tl" id="courseTimeline"></div>
    <p class="legend">
      <span class="lg lg-final"></span><b>期末 / 考试</b>
      <span class="lg lg-mid"></span><b>期中</b>
    </p>
  </section>

  <section class="panel" id="sec-method">
    <h2>师兄推荐的学习方法</h2>
    <div id="methodBody"></div>
  </section>

  <section class="panel" id="sec-files">
    <h2>课程资料 <span class="hint">建设中</span></h2>
    <div class="placeholder">
      <div class="big">📝</div>
      这一块将逐步填充：教学安排明细、重点章节、复习资料、学长学姐经验整理等。<br>
      每个学科的专属内容会逐个搭建。
    </div>
  </section>
</main>

<footer>
  课表优化 · 课程详情页 · <a href="index.html">返回总览</a>
</footer>

<script src="data/courses.js"></script>
<script src="js/main.js"></script>
</body>
</html>
